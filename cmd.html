<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShineOS Terminal</title>
    <style>
        body {
            font-family: "Open Sans", sans-serif;
            background: #000000;
            color: #f2ffff;
            margin: 0;
            padding: 20px;
            cursor: url('assets/system/cursor.png'),auto;
        }

        #terminal {
            width: 100%;
            height: 90vh;
            background: #000;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
            border: none;
        }

        #input-line {
            display: flex;
            align-items: center;
        }

        #prompt {
            color: #f2ffff;
            margin-right: 10px;
        }

        #command-input {
            background: transparent;
            border: none;
            color: #f2ffff;
            outline: none;
            flex-grow: 1;
            font-family: 'Courier New', monospace;
            font-size: 16px;
        }

        .output {
            white-space: pre-wrap;
            word-break: break-word;
            color: #f2ffff;
        }

        .error {
            color: #ff0000;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="output">Booting ShineOS kernel...</div>
        <div id="input-line">
            <span id="prompt">shine:/#</span>
            <input type="text" id="command-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus>
        </div>
    </div>

    <script type="module">
        import { ShineKernel } from './core/driver-registry.js';
        import { DomTTYDriver } from './core/drivers/tty/dom-tty-driver.js';
        import { MemoryFSDriver } from './core/drivers/fs/memory-fs-driver.js';
        import { FileSystemAccessDriver } from './core/drivers/fs/file-system-access-driver.js';
        import { ShineShell } from './core/shell/shine-sh.js';
        import { detectRuntimeCapabilities, runtimeSummary } from './core/runtime/runtime-probe.js';

        const terminal = document.getElementById('terminal');
        const prompt = document.getElementById('prompt');
        const commandInput = document.getElementById('command-input');

        const capabilities = detectRuntimeCapabilities();
        const kernel = new ShineKernel({ runtimeCapabilities: capabilities });

        kernel.drivers.register('tty', 'dom', (options) => new DomTTYDriver(options));
        kernel.drivers.register('fs', 'memory', () => new MemoryFSDriver());
        kernel.drivers.register('fs', 'fsa', () => new FileSystemAccessDriver());

        const tty = kernel.drivers.load('tty', 'dom', {
            terminalElement: terminal,
            promptElement: prompt,
            inputElement: commandInput
        });

        kernel.drivers.load('fs', 'memory');

        const shell = new ShineShell({ kernel });
        const commandHistory = [];
        let historyIndex = -1;

        tty.print('ShineOS unix-like shell started. Type "help".', 'output');
        tty.print('Drivers loaded without hardcoded renderer: tty/dom + fs/memory.', 'output');
        tty.print(`Runtime probe: ${runtimeSummary(capabilities)}`, 'output');

        if (!capabilities.wasixReady) {
            tty.print('Note: Wasmer/WASI(X) runtime is not active yet. Current build is a JS kernel prototype.', 'output');
        }

        commandInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const input = commandInput.value.trim();
                if (!input) return;
                commandHistory.unshift(input);
                historyIndex = -1;
                tty.print(`${prompt.textContent} ${input}`);
                commandInput.value = '';

                await kernel.spawn('sh', async () => {
                    try {
                        const result = await shell.execute(input);
                        if (result) tty.print(result);
                    } catch (err) {
                        tty.print(`Error: ${err.message}`, 'error');
                    }
                });

                tty.focusInput();
            }

            if (e.key === 'ArrowUp') {
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex += 1;
                    commandInput.value = commandHistory[historyIndex];
                }
            }

            if (e.key === 'ArrowDown') {
                if (historyIndex > 0) {
                    historyIndex -= 1;
                    commandInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = -1;
                    commandInput.value = '';
                }
            }
        });
    </script>
</body>
</html>
